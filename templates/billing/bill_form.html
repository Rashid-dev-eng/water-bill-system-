{% extends "base.html" %}
{% block title %}Generate Bill | NOLELO{% endblock %}
{% block page_title %}Generate Bill{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-xl-8">
    <div class="glass-card p-4">
      <form method="post">
        {% csrf_token %}
        <div class="row g-3">
          {% for field in form %}
            <div class="col-md-6">
              <label class="form-label">{{ field.label }}</label>
              {{ field }}
              {{ field.errors }}
            </div>
          {% endfor %}
        </div>
        <div class="mt-4 d-flex gap-2">
          <button class="btn btn-primary" type="submit">Generate Bill</button>
          <a class="btn btn-soft" href="{% url 'billing:bill-list' %}">Back to Bills</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
