{% extends "base.html" %}
{% block title %}Delete Entry | NOLELO{% endblock %}
{% block page_title %}Delete Entry{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="glass-card p-4">
      <p>Are you sure you want to delete the usage entry for <strong>{{ entry.site.display_label }}</strong> on <strong>{{ entry.entry_date }}</strong>?</p>
      <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
          <button class="btn btn-danger" type="submit">Delete</button>
          <a class="btn btn-soft" href="{% url 'water:history' %}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
